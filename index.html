<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02040b">
<title>Mapa del Cielo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306102a'/%3E%3Cpath d='M32 10l4 14 14 4-14 4-4 14-4-14-14-4 14-4z' fill='%23ffe9b0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#02040b; --glass:rgba(14,22,44,.62); --glass-strong:rgba(14,22,44,.86);
  --line:rgba(160,190,255,.18); --text:#e9eefc; --muted:#9aa8c9; --accent:#ffd27a; --accent2:#8fb4ff;
}
body.night{
  --glass:rgba(30,0,0,.6); --glass-strong:rgba(30,0,0,.88); --line:rgba(255,40,40,.25);
  --text:#ff5a4a; --muted:#b33a30; --accent:#ff6a50; --accent2:#e0453a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- Pantalla inicial ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at 50% 115%,rgba(60,90,170,.55),transparent 60%),
             radial-gradient(ellipse at 50% -10%,rgba(40,30,90,.5),transparent 60%),#02040b;
  transition:opacity .6s ease}
#intro.hide{opacity:0;pointer-events:none}
#intro .stars{position:absolute;inset:0;pointer-events:none;opacity:.8}
#intro h1{position:relative;font-weight:250;font-size:clamp(34px,9vw,54px);letter-spacing:.06em;margin:0 0 6px}
#intro h1 b{font-weight:600;color:var(--accent)}
#intro p{position:relative;color:var(--muted);max-width:420px;line-height:1.5;margin:8px 0}
#start{position:relative;margin-top:30px;font-size:22px;font-weight:600;letter-spacing:.04em;padding:20px 64px;border-radius:999px;
  color:#0b1020;background:linear-gradient(135deg,#ffe3a3,#ffb860);box-shadow:0 10px 40px rgba(255,190,90,.35),0 0 0 1px rgba(255,255,255,.2) inset}
#start:active{transform:scale(.97)}
#intro small{position:relative;color:var(--muted);opacity:.75;margin-top:22px;font-size:13px;max-width:380px;line-height:1.45}

/* ---------- Barra superior ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
.searchbox{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);
  border-radius:16px;padding:0 12px;height:46px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:560px;margin:0 auto}
.searchbox svg{flex:none;opacity:.7}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:16px;height:100%}
#q::placeholder{color:var(--muted)}
#qclear{display:none;font-size:20px;color:var(--muted);padding:6px}
#results{pointer-events:auto;max-width:560px;margin:6px auto 0;background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;
  overflow:auto;max-height:46vh;display:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#results button{display:flex;width:100%;text-align:left;padding:12px 14px;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
#results button:last-child{border-bottom:0}
#results .k{margin-left:auto;font-size:12px;color:var(--muted)}
#status{text-align:center;font-size:12.5px;color:var(--muted);margin-top:8px;text-shadow:0 1px 4px #000;letter-spacing:.02em}
#status b{color:var(--text);font-weight:500}

/* ---------- Controles inferiores ---------- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.panel{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--glass);border:1px solid var(--line);border-radius:20px;
  padding:10px 12px 8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.timerow{display:flex;align-items:center;gap:10px}
#tlabel{font-size:13px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlabel span{color:var(--muted)}
#trange{width:100%;margin:8px 0 6px;accent-color:var(--accent);height:28px}
.btns{display:flex;justify-content:space-between;gap:4px}
.btns button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11px;color:var(--muted)}
.btns button .i{font-size:19px;line-height:22px;color:var(--text)}
.btns button.on{background:rgba(255,210,122,.14);color:var(--accent)}
body.night .btns button.on{background:rgba(255,60,40,.15)}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* ---------- Ficha de información ---------- */
#card{position:fixed;left:10px;right:10px;z-index:20;bottom:calc(150px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;
  background:var(--glass-strong);border:1px solid var(--line);border-radius:20px;padding:16px 18px 16px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.5);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s ease}
#card.show{transform:none;opacity:1;pointer-events:auto}
#card h2{margin:0 34px 2px 0;font-size:22px;font-weight:600}
#card .sub{color:var(--accent2);font-size:13px;margin-bottom:10px}
#card .facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:10px}
#card .facts b{color:var(--text);font-weight:500}
#card p{margin:0;line-height:1.5;font-size:14.5px}
#card .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--muted);background:rgba(255,255,255,.06)}
#card .go{margin-top:12px;font-size:13px;padding:8px 14px;border-radius:999px;background:rgba(255,210,122,.15);color:var(--accent)}

body.night .i,body.night .go,body.night #status,body.night #tlabel{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(-45deg) brightness(.8)}
#layers{position:fixed;right:10px;z-index:21;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--glass-strong);border:1px solid var(--line);
  border-radius:16px;padding:12px;display:none;flex-direction:column;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#layers.show{display:flex}
#layers label{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 2px}
#layers input{width:20px;height:20px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:30;max-width:88vw;
  background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;text-align:center;
  opacity:0;transition:.3s;pointer-events:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){#card{right:auto;left:20px;bottom:24px;width:380px}#layers{bottom:24px;right:20px}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="intro">
  <canvas class="stars" id="introStars"></canvas>
  <h1>Mapa del <b>Cielo</b></h1>
  <p>Apunta tu celular al cielo y descubre qué estrellas, constelaciones y planetas estás mirando, en tiempo real.</p>
  <button id="start">Comenzar</button>
  <small>Te pediremos acceso a tu ubicación y a los sensores de movimiento. Si no das la ubicación, usaremos Villa Alemana, Chile.</small>
</div>

<div id="top">
  <div class="searchbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar: Júpiter, Cruz del Sur, Sirio…" autocomplete="off" enterkeyhint="search">
    <button id="qclear" aria-label="Borrar">×</button>
  </div>
  <div id="results"></div>
  <div id="status"></div>
</div>

<div id="card"><button class="x" aria-label="Cerrar">×</button><div id="cardBody"></div></div>

<div id="layers">
  <label><input type="checkbox" id="lyConst" checked> Constelaciones</label>
  <label><input type="checkbox" id="lyNames" checked> Nombres</label>
  <label><input type="checkbox" id="lyMW" checked> Vía Láctea</label>
  <label><input type="checkbox" id="lyGrid"> Cuadrícula de altura</label>
</div>

<div id="bottom">
  <div class="panel">
    <div class="timerow">
      <div id="tlabel">—</div>
      <button class="chip" id="now">Ahora</button>
      <button class="chip" id="play" aria-label="Reproducir">▶ Acelerar</button>
    </div>
    <input id="trange" type="range" min="-720" max="720" step="5" value="0" aria-label="Adelantar o retroceder el tiempo">
    <div class="btns">
      <button id="bSensor"><span class="i">🧭</span><span>Sensores</span></button>
      <button id="bNight"><span class="i">🔴</span><span>Modo noche</span></button>
      <button id="bLayers"><span class="i">✨</span><span>Capas</span></button>
      <button id="bZoomOut"><span class="i">－</span><span>Alejar</span></button>
      <button id="bZoomIn"><span class="i">＋</span><span>Acercar</span></button>
    </div>
  </div>
</div>
<div id="toast"></div>

<!-- =================== Cálculos astronómicos (sin DOM, se prueban con tools/test_astro.mjs) =================== -->
<script id="astro">
const Astro = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const sin = Math.sin, cos = Math.cos;
  const n360 = x => ((x % 360) + 360) % 360;

  const julian = date => date.getTime() / 86400000 + 2440587.5;
  // Siglos julianos (Tiempo Terrestre ≈ UTC + 69 s) desde J2000.0
  const centuries = date => (julian(date) + 69.2 / 86400 - 2451545.0) / 36525;

  // Tiempo sidéreo medio de Greenwich (grados), IAU 1982
  function gmst(date) {
    const d = julian(date) - 2451545.0, T = d / 36525;
    return n360(280.46061837 + 360.98564736629 * d + 0.000387933 * T * T - T * T * T / 38710000);
  }

  const radecToVec = (ra, dec) => {
    const a = ra * D2R, d = dec * D2R;
    return [cos(d) * cos(a), cos(d) * sin(a), sin(d)];
  };
  const vecToRadec = v => {
    const r = Math.hypot(v[0], v[1], v[2]);
    return [n360(Math.atan2(v[1], v[0]) * R2D), Math.asin(v[2] / r) * R2D];
  };
  const mulMV = (m, v) => [
    m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
    m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
    m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

  // Precesión IAU 1976 (Lieske): J2000 -> ecuador medio de la fecha
  function precessionMatrix(T) {
    const as = D2R / 3600;
    const z0 = (2306.2181 * T + 0.30188 * T * T + 0.017998 * T * T * T) * as;
    const z = (2306.2181 * T + 1.09468 * T * T + 0.018203 * T * T * T) * as;
    const th = (2004.3109 * T - 0.42665 * T * T - 0.041833 * T * T * T) * as;
    const cz0 = cos(z0), sz0 = sin(z0), cz = cos(z), sz = sin(z), ct = cos(th), st = sin(th);
    return [
      cz0 * ct * cz - sz0 * sz, -sz0 * ct * cz - cz0 * sz, -st * cz,
      cz0 * ct * sz + sz0 * cz, -sz0 * ct * sz + cz0 * cz, -st * sz,
      cz0 * st, -sz0 * st, ct];
  }

  // Ecuatorial de la fecha -> horizonte local (filas: Este, Norte, Cenit)
  function horizonMatrix(lstDeg, latDeg) {
    const t = lstDeg * D2R, p = latDeg * D2R;
    const ct = cos(t), st = sin(t), cp = cos(p), sp = sin(p);
    return [-st, ct, 0,
      -sp * ct, -sp * st, cp,
      cp * ct, cp * st, sp];
  }

  const obliquity = T => 23.439291 - 0.0130042 * T;
  function eclToEq(v, epsDeg) {
    const e = epsDeg * D2R, c = cos(e), s = sin(e);
    return [v[0], c * v[1] - s * v[2], s * v[1] + c * v[2]];
  }

  // Sol: posición aparente de la fecha (Meeus, cap. 25, precisión ~0,01°)
  function sun(T) {
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * D2R;
    const e = 0.016708634 - 0.000042037 * T;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sin(M) + (0.019993 - 0.000101 * T) * sin(2 * M) + 0.000289 * sin(3 * M);
    const nu = M + C * D2R;
    const R = 1.000001018 * (1 - e * e) / (1 + e * cos(nu));
    const om = (125.04 - 1934.136 * T) * D2R;
    const lon = n360(L0 + C - 0.00569 - 0.00478 * sin(om));
    const eps = obliquity(T) + 0.00256 * cos(om);
    const v = eclToEq([cos(lon * D2R), sin(lon * D2R), 0], eps);
    return { lon, dist: R, vec: v };
  }

  // Luna: teoría ELP-2000/82 truncada (Meeus, cap. 47). Error típico < 0,05°
  const MOON_LR = [ // D, M, M', F, Σl (1e-6 °), Σr (1e-3 km)
    [0,0,1,0,6288774,-20905355],[2,0,-1,0,1274027,-3699111],[2,0,0,0,658314,-2955968],[0,0,2,0,213618,-569925],
    [0,1,0,0,-185116,48888],[0,0,0,2,-114332,-3149],[2,0,-2,0,58793,246158],[2,-1,-1,0,57066,-152138],
    [2,0,1,0,53322,-170733],[2,-1,0,0,45758,-204586],[0,1,-1,0,-40923,-129620],[1,0,0,0,-34720,108743],
    [0,1,1,0,-30383,104755],[2,0,0,-2,15327,10321],[0,0,1,2,-12528,0],[0,0,1,-2,10980,79661],
    [4,0,-1,0,10675,-34782],[0,0,3,0,10034,-23210],[4,0,-2,0,8548,-21636],[2,1,-1,0,-7888,24208],
    [2,1,0,0,-6766,30824],[1,0,-1,0,-5163,-8379],[1,1,0,0,4987,-16675],[2,-1,1,0,4036,-12831],
    [2,0,2,0,3994,-10445],[4,0,0,0,3861,-11650],[2,0,-3,0,3665,14403],[0,1,-2,0,-2689,-7003],
    [2,0,-1,2,-2602,0],[2,-1,-2,0,2390,10056],[1,0,1,0,-2348,6322],[2,-2,0,0,2236,-9884],
    [0,1,2,0,-2120,5751],[0,2,0,0,-2069,0],[2,-2,-1,0,2048,-4950],[2,0,1,-2,-1773,4130],
    [2,0,0,2,-1595,0],[4,-1,-1,0,1215,-3958],[0,0,2,2,-1110,0],[3,0,-1,0,-892,3258],
    [2,1,1,0,-810,2616],[4,-1,-2,0,759,-1897],[0,2,-1,0,-713,-2117],[2,2,-1,0,-700,2354]];
  const MOON_B = [ // D, M, M', F, Σb (1e-6 °)
    [0,0,0,1,5128122],[0,0,1,1,280602],[0,0,1,-1,277693],[2,0,0,-1,173237],[2,0,-1,1,55413],
    [2,0,-1,-1,46271],[2,0,0,1,32573],[0,0,2,1,17198],[2,0,1,-1,9266],[0,0,2,-1,8822],
    [2,-1,0,-1,8216],[2,0,-2,-1,4324],[2,0,1,1,4200],[2,1,0,-1,-3359],[2,-1,-1,1,2463],
    [2,-1,0,1,2211],[2,-1,-1,-1,2065],[0,1,-1,-1,-1870],[4,0,-1,-1,1828],[0,1,0,1,-1794],
    [0,0,0,3,-1749],[0,1,-1,1,-1565],[1,0,0,1,-1491],[0,1,1,1,-1475],[0,1,1,-1,-1410],
    [0,1,0,-1,-1344],[1,0,0,-1,-1335],[0,0,3,1,1107],[4,0,0,-1,1021],[4,0,-1,1,833]];
  function moon(T) {
    const Lp = n360(218.3164477 + 481267.88123421 * T - 0.0015786 * T * T);
    const D = n360(297.8501921 + 445267.1114034 * T - 0.0018819 * T * T) * D2R;
    const M = n360(357.5291092 + 35999.0502909 * T - 0.0001536 * T * T) * D2R;
    const Mp = n360(134.9633964 + 477198.8675055 * T + 0.0087414 * T * T) * D2R;
    const F = n360(93.2720950 + 483202.0175233 * T - 0.0036539 * T * T) * D2R;
    const A1 = (119.75 + 131.849 * T) * D2R, A2 = (53.09 + 479264.290 * T) * D2R, A3 = (313.45 + 481266.484 * T) * D2R;
    const E = 1 - 0.002516 * T - 0.0000074 * T * T;
    let sl = 0, sr = 0, sb = 0;
    for (const [d, m, mp, f, l, r] of MOON_LR) {
      const arg = d * D + m * M + mp * Mp + f * F;
      const ef = m === 0 ? 1 : (Math.abs(m) === 1 ? E : E * E);
      sl += l * ef * sin(arg); sr += r * ef * cos(arg);
    }
    for (const [d, m, mp, f, b] of MOON_B) {
      const ef = m === 0 ? 1 : (Math.abs(m) === 1 ? E : E * E);
      sb += b * ef * sin(d * D + m * M + mp * Mp + f * F);
    }
    const LpR = Lp * D2R;
    sl += 3958 * sin(A1) + 1962 * sin(LpR - F) + 318 * sin(A2);
    sb += -2235 * sin(LpR) + 382 * sin(A3) + 175 * sin(A1 - F) + 175 * sin(A1 + F) + 127 * sin(LpR - Mp) - 115 * sin(LpR + Mp);
    const om = (125.04452 - 1934.136261 * T) * D2R;
    const lon = n360(Lp + sl / 1e6 - 0.004778 * sin(om)); // + nutación en longitud
    const lat = sb / 1e6;
    const dist = 385000.56 + sr / 1000; // km
    const eps = obliquity(T) + 0.00256 * cos(om);
    const cb = cos(lat * D2R);
    const v = eclToEq([cb * cos(lon * D2R), cb * sin(lon * D2R), sin(lat * D2R)], eps);
    return { lon, lat, dist, vec: v };
  }

  // Planetas: elementos keplerianos de JPL (Standish), válidos 1800–2050. [valor J2000, tasa por siglo]
  const EL = {
    mercurio: [[0.38709927, 0.00000037], [0.20563593, 0.00001906], [7.00497902, -0.00594749], [252.25032350, 149472.67411175], [77.45779628, 0.16047689], [48.33076593, -0.12534081]],
    venus:    [[0.72333566, 0.00000390], [0.00677672, -0.00004107], [3.39467605, -0.00078890], [181.97909950, 58517.81538729], [131.60246718, 0.00268329], [76.67984255, -0.27769418]],
    tierra:   [[1.00000261, 0.00000562], [0.01671123, -0.00004392], [-0.00001531, -0.01294668], [100.46457166, 35999.37244981], [102.93768193, 0.32327364], [0, 0]],
    marte:    [[1.52371034, 0.00001847], [0.09339410, 0.00007882], [1.84969142, -0.00813131], [-4.55343205, 19140.30268499], [-23.94362959, 0.44441088], [49.55953891, -0.29257343]],
    jupiter:  [[5.20288700, -0.00011607], [0.04838624, -0.00013253], [1.30439695, -0.00183714], [34.39644051, 3034.74612775], [14.72847983, 0.21252668], [100.47390909, 0.20469106]],
    saturno:  [[9.53667594, -0.00125060], [0.05386179, -0.00050991], [2.48599187, 0.00193609], [49.95424423, 1222.49362201], [92.59887831, -0.41897216], [113.66242448, -0.28867794]],
  };
  // Posición heliocéntrica eclíptica J2000 (UA)
  function helio(name, T) {
    const el = EL[name].map(([v0, r]) => v0 + r * T);
    const [a, e, I, L, wb, Om] = el;
    const M = n360(L - wb) * D2R, w = (wb - Om) * D2R, O = Om * D2R, i = I * D2R;
    let E = M + e * sin(M);

let lastT = performance.now(), statusT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (S.playing) { S.timeOffset += dt * 3600 * 1000; syncSlider(); }

  else { inertia(dt); setManualCamera(); }
  const sh = toHor(bodies.sol.vec); sunAltDeg = Math.asin(sh[2]) * R2D;
  const starDim = skyColors()[2];
  const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground(starDim);
  if (S.show.mw) drawMilkyWay(starDim);

}

/* ---------- Ficha ---------- */
function riseSetText(getVec) {
  // Busca el próximo cruce del horizonte en las próximas 24 h (pasos de 10 min)
  const base = frameDate.getTime();
  const altAt = ms => { const d = new Date(ms); const v = Astro.mulMV(Astro.horizonMatrix(Astro.gmst(d) + S.loc.lon, S.loc.lat), getVec(d)); return v[2]; };
  const a0 = altAt(base);
  for (let m = 10; m <= 1440; m += 10) {
    const a = altAt(base + m * 60000);
    if ((a > 0) !== (a0 > 0)) {
      const tm = new Date(base + (m - 5) * 60000).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
      return a0 > 0 ? `Se oculta cerca de las ${tm}` : `Sale cerca de las ${tm}`;
    }
  }
  return a0 > 0 ? 'Visible toda la noche (nunca se pone desde aquí)' : 'No sale desde tu ubicación';
}

  return d => {
    const T = Astro.centuries(d), P = Astro.precessionMatrix(T);

}

}

    const st = STARS[sel.i], k = starKey(sel.i), info = KEY_FIRST[k] === sel.i ? STAR_INFO[k] : null;
    h = starLabel(sel.i);
    const con = CONST_NAME[st[5]] || st[5] || '';

let INDEX = [];

  for (const c of CONSTS) INDEX.push({ label: c.n, kind: 'Constelación', sel: { type: 'const', c }, pri: 1 });
  for (const d of DSO) INDEX.push({ label: d[0], kind: 'Cielo profundo', sel: { type: 'dso', d }, pri: 2 });
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    const n = starName(i); if (!n || seen.has(n)) continue; seen.add(n);
    INDEX.push({ label: n, kind: 'Estrella', sel: { type: 'star', i }, pri: 3, alt: STARS[i][6] });
  }
  // sinónimos útiles
  const syn = [['Tres Marías', 'const', 'Ori'], ['Cinturón de Orión', 'const', 'Ori'], ['Falsa Cruz', 'const', 'Vel'], ['Lucero', 'body', 'venus'], ['Siete Cabrillas', 'dso', 'Pléyades'], ['Spica', 'star', 'α Vir'], ['Sirius', 'star', 'α CMa'], ['Estrella Polar', 'star', 'α UMi'], ['Escorpio', 'const', 'Sco'], ['Escorpion', 'const', 'Sco']];

}
function search(q) {

    .filter(([p]) => p < 9).sort((a, b) => a[0] - b[0] || a[1].pri - b[1].pri || a[1].label.localeCompare(b[1].label)).slice(0, 8).map(x => x[1]);
}

/* ---------- Tocar y arrastrar ---------- */
let flyTo = null, vel = [0, 0];
function inertia(dt) {

    const k = 1 - Math.exp(-dt * 4);
    S.az += da * k; S.alt += (flyTo.alt - S.alt) * k;

  } else if (!drag && (vel[0] || vel[1])) {
    S.az += vel[0] * dt; S.alt = clamp(S.alt + vel[1] * dt, -Math.PI / 2, Math.PI / 2);
    const f = Math.exp(-dt * 4); vel = [vel[0] * f, vel[1] * f];

  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, lt: performance.now() };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), fov: S.fov }; drag = null; }
  res.style.display = 'none'; qIn.blur();
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    S.fov = clamp(pinch.fov * pinch.d / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1])), 15, 150); updateScale(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.moved = true;
    if (S.mode === 'sensor') { camToManual(); OR.manualChosen = true; setMode('manual', true); toast('Modo manual · toca 🧭 para volver a los sensores'); }
    flyTo = null;
  }
  if (drag.moved) {
    const k = 1 / scale; // radianes por píxel en el centro
    const now = performance.now(), dtm = Math.max(1, now - drag.lt) / 1000;
    const daz = -dx * k / Math.max(0.25, Math.cos(S.alt)), dal = dy * k;
    S.az += daz; S.alt = clamp(S.alt + dal, -Math.PI / 2, Math.PI / 2);
    vel = [daz / dtm * 0.6, dal / dtm * 0.6]; drag.lt = now;
  }
  drag.x = e.clientX; drag.y = e.clientY;
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && !drag.moved && performance.now() - drag.t0 < 500) tap(e.clientX, e.clientY);
  if (drag && performance.now() - drag.lt > 80) vel = [0, 0];
  if (pointers.size === 0) drag = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; pinch = null; });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

function tap(x, y) {
  $('layers').classList.remove('show'); $('bLayers').classList.remove('on');
  let best = null, bd = 30;
  for (const name of ['sol', 'luna', ...PLANETS]) {
    const b = bodies[name]; if (!b.vis) continue;
    const d = Math.hypot(b.sx - x, b.sy - y) - (name === 'luna' ? 10 : 6);
    if (d < bd) { bd = d; best = { type: 'body', name }; }
  }
  if (!best) {
    let bs = 1e9;
    for (let i = 0; i < N; i++) {
      if (!sVis[i] || STARS[i][2] > 4.8) continue;
      const d = Math.hypot(sx[i] - x, sy[i] - y);
      const sc = d + STARS[i][2] * 2.5; // preferir las brillantes
      if (d < 28 && sc < bs) { bs = sc; best = { type: 'star', i }; }
    }
  }
  if (!best) for (const d of DSO) if (d.vis && Math.hypot(d.sx - x, d.sy - y) < Math.max(26, d[3] * D2R * scale)) { best = { type: 'dso', d }; break; }
  if (!best && S.show.const) {
    // constelación: cerca de una de sus líneas o de su nombre
    let bc = null, bdist = 22;
    for (const c of CONSTS) for (const poly of c.l) for (let k = 1; k < poly.length; k++) {
      const a = poly[k - 1], b = poly[k]; if (!sVis[a] || !sVis[b]) continue;
      const d = segDist(x, y, sx[a], sy[a], sx[b], sy[b]); if (d < bdist) { bdist = d; bc = c; }
    }
    for (const [c, lx, ly] of constLabelPos) if (Math.abs(lx - x) < 60 && Math.abs(ly - y) < 16) bc = c;
    if (bc) best = { type: 'const', c: bc };
  }
  if (best) showCard(best); else hideCard();
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  if (l > (W + H) ** 2) return 1e9;
  const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0;
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}

/* =================== Inicio =================== */
function requestOrientation() {
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') {
    return D.requestPermission().then(r => { if (r === 'granted') startSensors(); else toast('Sin permiso de movimiento: arrastra el cielo con el dedo', 3500); }).catch(() => {});
  }
  startSensors(); return Promise.resolve();
}
let started = false;
$('start').addEventListener('click', () => {
  if (started) return; started = true;
  const p = requestOrientation(); // en iPhone debe llamarse directamente desde el toque
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  $('intro').classList.add('hide');
  setTimeout(() => $('intro').remove(), 700);
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      S.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: `Tu ubicación (${fmt(pos.coords.latitude, 2)}°, ${fmt(pos.coords.longitude, 2)}°)` };
      S.timeDirty = true; toast('Ubicación encontrada ✓');
    }, () => toast('Usando Villa Alemana, Chile como ubicación', 3200), { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  } else toast('Usando Villa Alemana, Chile como ubicación', 3200);
  p.then(() => setTimeout(() => { if (!OR.has) toast('Arrastra el cielo con el dedo o el mouse para explorarlo', 3500); }, 1500));
});
// Estrellitas decorativas de la portada
(function intro() {
  const c = $('introStars'), x = c.getContext('2d'), d = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * d; c.height = innerHeight * d;
  const r = rng(7);
  for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(220,230,255,${0.2 + r() * 0.7})`; const s = (0.3 + r() ** 3 * 1.4) * d; x.beginPath(); x.arc(r() * c.width, r() * c.height, s, 0, 7); x.fill(); }
})();
window.addEventListener('resize', resize);
resize();
setMode('manual', true);
updateEphemeris(simDate());
buildIndex();
requestAnimationFrame(frame);
</script>
